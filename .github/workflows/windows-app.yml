name: Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['windows-gui/**', '.github/workflows/windows-app.yml']

env:
  CLIENT_VERSION: '1.1.11'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      TT_TEST_LINK: ${{ secrets.TT_TEST_LINK }}
    steps:
      - uses: actions/checkout@v4

      - name: Build GUI (.NET Framework 4.8, no runtime needed on Windows 10/11)
        run: dotnet build windows-gui/TrustTunnelGUI.csproj -c Release -o build

      - name: Assemble package
        shell: pwsh
        run: |
          $v = $env:CLIENT_VERSION
          Invoke-WebRequest "https://github.com/TrustTunnel/TrustTunnelClient/releases/download/v$v/trusttunnel_client-v$v-windows-x86_64.zip" -OutFile client.zip
          New-Item -ItemType Directory pkg/TrustTunnel -Force | Out-Null
          Expand-Archive client.zip -DestinationPath pkg/TrustTunnel -Force
          Copy-Item build/TrustTunnel.exe, build/TrustTunnel.exe.config pkg/TrustTunnel/
          Copy-Item windows-gui/package/* pkg/TrustTunnel/
          Get-ChildItem pkg/TrustTunnel | Format-Table Name, Length

      - name: Live test against the real server
        if: env.TT_TEST_LINK != ''
        timeout-minutes: 8
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:GITHUB_WORKSPACE\shots\$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          function Ip { $r = & curl.exe -s --max-time 15 -H 'Connection: close' https://api.ipify.org; if ($r) { $r.Trim() } else { 'error' } }
          New-Item -ItemType Directory "$env:GITHUB_WORKSPACE\shots" -Force | Out-Null
          Set-Location pkg/TrustTunnel
          $before = Ip; Write-Host "IP before: $before"
          .\setup_wizard.exe --mode non-interactive --deeplink $env:TT_TEST_LINK --settings trusttunnel_client.toml | Out-Null
          $t = [IO.File]::ReadAllText("$PWD\trusttunnel_client.toml") -replace '(?m)^killswitch_enabled = .*', 'killswitch_enabled = false'
          [IO.File]::WriteAllText("$PWD\trusttunnel_client.toml", $t)
          [IO.File]::WriteAllText("$PWD\gui.ini", "autoconnect=1`r`nname=Sabi VPN CI test`r`n")
          Start-Process .\TrustTunnel.exe
          Start-Sleep 30
          Shot 'connected'
          Start-Sleep 5
          Shot 'connected2'
          $after = Ip; Write-Host "IP while connected: $after"
          $running = [bool](Get-Process trusttunnel_client -ErrorAction SilentlyContinue)
          Write-Host "client running: $running"
          # press the big button (Disconnect) through UI Automation -> exercises the graceful Ctrl+C stop
          Add-Type @'
          using System; using System.Runtime.InteropServices;
          public static class M { [DllImport("user32.dll")] public static extern bool SetCursorPos(int x,int y);
            [DllImport("user32.dll")] public static extern void mouse_event(int f,int x,int y,int d,IntPtr e); }
          '@
          $p = Get-Process TrustTunnel -ErrorAction SilentlyContinue | Select-Object -First 1
          $btn = $null
          if ($p -and $p.MainWindowHandle -ne 0) {
            $w = [System.Windows.Automation.AutomationElement]::FromHandle($p.MainWindowHandle)
            foreach ($e in $w.FindAll([System.Windows.Automation.TreeScope]::Children, [System.Windows.Automation.Condition]::TrueCondition)) {
              $r = $e.Current.BoundingRectangle
              if ($r.Width -ge 250 -and $r.Height -ge 40 -and $r.Height -le 70) { $btn = $r }
            }
          }
          if ($btn) { $x=[int]($btn.X+$btn.Width/2); $y=[int]($btn.Y+$btn.Height/2); [M]::SetCursorPos($x,$y); Start-Sleep -m 200; [M]::mouse_event(2,0,0,0,[IntPtr]::Zero); [M]::mouse_event(4,0,0,0,[IntPtr]::Zero); Write-Host "clicked disconnect at $x,$y" } else { Write-Host 'button not found' }
          Start-Sleep 12
          Shot 'disconnected'
          $stillRunning = [bool](Get-Process trusttunnel_client -ErrorAction SilentlyContinue)
          $final = Ip
          Write-Host "client still running after disconnect: $stillRunning"
          Write-Host "IP after disconnect: $final"
          Copy-Item trusttunnel_last.log "$env:GITHUB_WORKSPACE\shots\" -ErrorAction SilentlyContinue
          Write-Host '--- processes ---'; Get-Process TrustTunnel, trusttunnel_client -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, MainWindowHandle, MainWindowTitle, SessionId | Out-String | Write-Host
          Write-Host '--- routes ---'; route print -4 | Select-Object -First 40 | Out-String | Write-Host
          Write-Host '--- GUI log ---'; Get-Content trusttunnel_last.log -ErrorAction SilentlyContinue | Select-Object -Last 80 | Out-String | Write-Host
          Get-ChildItem . | Format-Table Name, Length | Out-String | Write-Host
          "before=$before`nconnected=$after`nclient_running=$running`nstill_running_after_stop=$stillRunning`nafter=$final" | Set-Content "$env:GITHUB_WORKSPACE\shots\result.txt"
          Get-Process TrustTunnel, trusttunnel_client -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item trusttunnel_client.toml, gui.ini, trusttunnel_last.log -ErrorAction SilentlyContinue

      - name: Publish test results to ci-results branch
        if: always() && env.TT_TEST_LINK != ''
        shell: pwsh
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-results
          git rm -rf --cached . | Out-Null
          git add -f shots
          git commit -m "results $env:GITHUB_RUN_ID"
          git push -f origin ci-results

      - name: Upload package
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: TrustTunnel-Windows
          path: pkg/
