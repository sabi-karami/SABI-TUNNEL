name: Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['windows-gui/**', '.github/workflows/windows-app.yml']

env:
  CLIENT_VERSION: '1.1.11'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      TT_TEST_LINK: ${{ secrets.TT_TEST_LINK }}
    steps:
      - uses: actions/checkout@v4

      - name: Build GUI (.NET Framework 4.8, no runtime needed on Windows 10/11)
        run: dotnet build windows-gui/TrustTunnelGUI.csproj -c Release -o build

      - name: Assemble package
        shell: pwsh
        run: |
          $v = $env:CLIENT_VERSION
          Invoke-WebRequest "https://github.com/TrustTunnel/TrustTunnelClient/releases/download/v$v/trusttunnel_client-v$v-windows-x86_64.zip" -OutFile client.zip
          New-Item -ItemType Directory pkg/TrustTunnel -Force | Out-Null
          Expand-Archive client.zip -DestinationPath pkg/TrustTunnel -Force
          Copy-Item build/TrustTunnel.exe, build/TrustTunnel.exe.config pkg/TrustTunnel/
          Copy-Item windows-gui/package/* pkg/TrustTunnel/
          Copy-Item windows-gui/fonts/OFL.txt pkg/TrustTunnel/OFL-Vazirmatn.txt
          Get-ChildItem pkg/TrustTunnel | Format-Table Name, Length

      - name: Live UI test against the real server
        if: env.TT_TEST_LINK != ''
        timeout-minutes: 10
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          Add-Type @'
          using System; using System.Text; using System.Collections.Generic; using System.Runtime.InteropServices;
          public static class M {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x,int y);
            [DllImport("user32.dll")] public static extern void mouse_event(int f,int x,int y,int d,IntPtr e);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h,int m,IntPtr w,IntPtr l);
            public delegate bool EP(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(EP cb, IntPtr l);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            [DllImport("user32.dll")] static extern bool GetWindowRect(IntPtr h, out RECT r);
            public static string[] List(int pid) {
              var res = new List<string>();
              EnumWindows((h, l) => { uint p; GetWindowThreadProcessId(h, out p);
                if (p == pid && IsWindowVisible(h)) { var sb = new StringBuilder(256); GetWindowText(h, sb, 256); RECT r; GetWindowRect(h, out r);
                  res.Add(h.ToInt64() + "|" + sb + "|" + r.L + "|" + r.T + "|" + (r.R - r.L) + "|" + (r.B - r.T)); }
                return true; }, IntPtr.Zero);
              return res.ToArray();
            }
          }
          '@
          $shots = "$env:GITHUB_WORKSPACE\shots"
          New-Item -ItemType Directory $shots -Force | Out-Null
          $R = [ordered]@{}
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$shots\$name.png"); $g.Dispose(); $bmp.Dispose()
            Write-Host "shot: $name"
          }
          function Ip { $r = & curl.exe -s --max-time 12 -H 'Connection: close' https://api.ipify.org; if ($r) { $r.Trim() } else { 'error' } }
          function Gui { Get-Process TrustTunnel -ErrorAction SilentlyContinue | Select-Object -First 1 }
          function Client { [bool](Get-Process trusttunnel_client -ErrorAction SilentlyContinue) }
          function GuiCmd($c) { Start-Process .\TrustTunnel.exe -ArgumentList "--$c"; Start-Sleep -Milliseconds 2200 }
          function Wins {
            $p = Gui; if (-not $p) { return @() }
            @([M]::List($p.Id) | ForEach-Object { $a = $_.Split('|'); [pscustomobject]@{ H = [IntPtr][long]$a[0]; Name = $a[1]; X = [int]$a[2]; Y = [int]$a[3]; W = [int]$a[4]; Hh = [int]$a[5] } } | Where-Object { $_.Name -ne '' -and $_.W -gt 60 })
          }
          function MainWin { Wins | Where-Object { $_.Name -like 'TrustTunnel*Sabi*' } | Select-Object -First 1 }
          function CloseDialogs {
            foreach ($w in Wins) { if ($w.Name -notlike 'TrustTunnel*Sabi*') { Write-Host "closing window '$($w.Name)'"; [void][M]::PostMessage($w.H, 0x10, [IntPtr]::Zero, [IntPtr]::Zero) } }
            Start-Sleep 1
          }
          function ClickMain($lx, $ly, $label) {
            $w = MainWin
            if (-not $w) { Write-Host "main window not found for $label"; return $false }
            $s = $w.W / 380.0
            [void][M]::SetForegroundWindow($w.H); Start-Sleep -Milliseconds 300
            $x = [int]($w.X + $lx * $s); $y = [int]($w.Y + $ly * $s)
            [void][M]::SetCursorPos($x, $y); Start-Sleep -Milliseconds 250
            [M]::mouse_event(2,0,0,0,[IntPtr]::Zero); Start-Sleep -Milliseconds 60; [M]::mouse_event(4,0,0,0,[IntPtr]::Zero)
            Write-Host "clicked $label at $x,$y (window $($w.X),$($w.Y) $($w.W)x$($w.Hh), scale $s)"
            Start-Sleep -Milliseconds 200; [void][M]::SetCursorPos(1000, 700)
            return $true
          }
          function Windows($label) { Write-Host "--- windows ($label) ---"; foreach ($w in Wins) { Write-Host ("  '{0}'  {1},{2} {3}x{4}" -f $w.Name, $w.X, $w.Y, $w.W, $w.Hh) } }

          Set-Location pkg/TrustTunnel
          $R.before = Ip; Write-Host "IP before: $($R.before)"

          # ---------- A: first run, no settings -> import dialog
          Start-Process .\TrustTunnel.exe; Start-Sleep 7
          Windows 'first run'; Shot '01-first-run-import'
          CloseDialogs; Start-Sleep 1; Shot '02-no-config'
          GuiCmd 'quit'; Start-Sleep 3
          $R.quit_first_run = -not (Gui)
          Get-Process TrustTunnel -ErrorAction SilentlyContinue | Stop-Process -Force

          # ---------- B: configured, idle
          .\setup_wizard.exe --mode non-interactive --deeplink $env:TT_TEST_LINK --settings trusttunnel_client.toml | Out-Null
          $t = [IO.File]::ReadAllText("$PWD\trusttunnel_client.toml") -replace '(?m)^killswitch_enabled = .*', 'killswitch_enabled = false'
          [IO.File]::WriteAllText("$PWD\trusttunnel_client.toml", $t)
          [IO.File]::WriteAllText("$PWD\gui.ini", "autoconnect=0`r`nname=Sabi VPN`r`n")
          Start-Process .\TrustTunnel.exe; Start-Sleep 6
          Windows 'idle'; Shot '03-off'
          GuiCmd 'settings'; Start-Sleep 1; Shot '04-settings'
          GuiCmd 'bypass'; Start-Sleep 1; Windows 'bypass'; Shot '05-bypass'; CloseDialogs
          GuiCmd 'home'; Start-Sleep 1

          # ---------- C: connect with a real mouse click on the big button
          $R.click_connect = ClickMain 190 417 'connect'
          Start-Sleep -Milliseconds 1500; Shot '06-connecting'
          Start-Sleep 22
          $R.connected_ip = Ip; Write-Host "IP while connected: $($R.connected_ip)"
          $R.client_running = Client
          Shot '07-on'
          $dl = Start-Job { & curl.exe -s -o NUL --max-time 25 'https://speed.cloudflare.com/__down?bytes=60000000' }
          Start-Sleep 9; Shot '08-on-traffic'
          Wait-Job $dl -Timeout 20 | Out-Null; Remove-Job $dl -Force
          GuiCmd 'settings'; Start-Sleep 1; Shot '09-settings-connected'
          GuiCmd 'log'; Start-Sleep 1; Windows 'log'; Shot '10-log'; CloseDialogs
          GuiCmd 'home'; Start-Sleep 1

          # ---------- D: disconnect with a real click
          $R.click_disconnect = ClickMain 190 417 'disconnect'
          Start-Sleep -Milliseconds 700; Shot '11-stopping'
          Start-Sleep 9; Shot '12-off-again'
          $R.client_after_disconnect = Client
          $R.ip_after_disconnect = Ip

          # ---------- E: click the orb to connect, CLI toggle off, CLI connect, then --quit while connected
          $R.click_orb = ClickMain 190 234 'orb'
          Start-Sleep 20
          $R.orb_ip = Ip; $R.orb_client = Client
          $dl = Start-Job { & curl.exe -s -o NUL --max-time 20 'https://speed.cloudflare.com/__down?bytes=40000000' }
          Start-Sleep 7; Shot '13-orb-on-traffic'
          Wait-Job $dl -Timeout 15 | Out-Null; Remove-Job $dl -Force
          GuiCmd 'toggle'; Start-Sleep 9
          $R.toggle_off_client = Client
          GuiCmd 'connect'; Start-Sleep 18
          $R.cli_connect_ip = Ip; $R.cli_connect_client = Client
          GuiCmd 'log'; Start-Sleep 1; Shot '14-log-connected'; CloseDialogs
          GuiCmd 'quit'; Start-Sleep 12
          $R.gui_after_quit = [bool](Gui); $R.client_after_quit = Client
          $R.ip_after_quit = Ip
          Shot '15-after-quit'

          # ---------- report
          Copy-Item trusttunnel_last.log $shots -ErrorAction SilentlyContinue
          if (Test-Path trusttunnel_gui_error.log) { $R.crash_log = $true; Copy-Item trusttunnel_gui_error.log $shots; Write-Host '--- CRASH LOG ---'; Get-Content trusttunnel_gui_error.log | Write-Host } else { $R.crash_log = $false }
          Write-Host '--- GUI log (tail) ---'; Get-Content trusttunnel_last.log -ErrorAction SilentlyContinue | Select-Object -Last 60 | Out-String | Write-Host
          Write-Host '--- routes ---'; route print -4 | Select-Object -First 30 | Out-String | Write-Host
          ($R.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join "`n" | Set-Content "$shots\result.txt"
          Get-Content "$shots\result.txt" | Write-Host
          Get-Process TrustTunnel, trusttunnel_client -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item trusttunnel_client.toml, gui.ini, trusttunnel_last.log, trusttunnel_gui_error.log -ErrorAction SilentlyContinue
          New-Item -ItemType Directory "$shots\bin" -Force | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\build\TrustTunnel.exe", "$env:GITHUB_WORKSPACE\build\TrustTunnel.exe.config" "$shots\bin\"

      - name: Publish test results to ci-results branch
        if: always() && env.TT_TEST_LINK != ''
        shell: pwsh
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-results
          git rm -rf --cached . | Out-Null
          git add -f shots
          git commit -m "results $env:GITHUB_RUN_ID"
          git push -f origin ci-results

      - name: Upload package
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: TrustTunnel-Windows
          path: pkg/
