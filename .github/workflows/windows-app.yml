name: Windows app

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish (or refresh) GitHub release v<APP_VERSION> with setup, zip, SHA256SUMS'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['windows-gui/**', '.github/workflows/windows-app.yml']

env:
  CLIENT_VERSION: '1.1.11'
  APP_VERSION: '3.1.0'

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      TT_TEST_LINK: ${{ secrets.TT_TEST_LINK }}
      TT_TEST_LINK2: ${{ secrets.TT_TEST_LINK2 }}
      TT_TEST_SHARE: ${{ secrets.TT_TEST_SHARE }}
    steps:
      - uses: actions/checkout@v4

      - name: Build GUI (.NET Framework 4.8, no runtime needed on Windows 10/11)
        # the run number is the build number the installed apps compare with the panel feed to update themselves
        run: dotnet build windows-gui/SabiTunnel.csproj -c Release -o build -p:SabiBuild=${{ github.run_number }}

      - name: Assemble package
        shell: pwsh
        run: |
          $v = $env:CLIENT_VERSION
          Invoke-WebRequest "https://github.com/TrustTunnel/TrustTunnelClient/releases/download/v$v/trusttunnel_client-v$v-windows-x86_64.zip" -OutFile client.zip
          New-Item -ItemType Directory pkg/SabiTunnel -Force | Out-Null
          Expand-Archive client.zip -DestinationPath pkg/SabiTunnel -Force
          Copy-Item build/SabiTunnel.exe, build/SabiTunnel.exe.config pkg/SabiTunnel/
          Copy-Item windows-gui/package/* pkg/SabiTunnel/
          Copy-Item windows-gui/fonts/OFL.txt pkg/SabiTunnel/OFL-Vazirmatn.txt
          Get-ChildItem pkg/SabiTunnel | Format-Table Name, Length

      - name: Build installer (Inno Setup 6)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DPkgDir=$env:GITHUB_WORKSPACE\pkg\SabiTunnel" /DAppVer=$env:APP_VERSION "/O$env:GITHUB_WORKSPACE\setup" windows-gui\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem setup | Format-Table Name, Length

      - name: Microsoft Defender scan (fails the build on any detection)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = "$env:GITHUB_WORKSPACE\shots"; New-Item -ItemType Directory "$out\bin" -Force | Out-Null
          & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -SignatureUpdate | Out-Null
          $sig = (Get-MpComputerStatus).AntivirusSignatureVersion
          $bad = 0; $lines = @("signatures=$sig")
          $files = @("$env:GITHUB_WORKSPACE\setup\SabiTunnel-Setup.exe") + (Get-ChildItem pkg\SabiTunnel -Include *.exe, *.dll -Recurse | ForEach-Object FullName)
          foreach ($f in $files) {
            $r = & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File $f -DisableRemediation 2>&1 | Out-String
            $code = $LASTEXITCODE
            $threat = ([regex]::Match($r, 'Threat\s*:\s*(\S+)')).Groups[1].Value
            if ($code -ne 0) { $bad++ }
            $lines += ("defender_{0}={1}" -f (Split-Path $f -Leaf), $(if ($code -eq 0) { 'clean' } else { "DETECTED $threat" }))
          }
          $lines | Set-Content "$out\defender.txt"; $lines | Write-Host
          Copy-Item build\SabiTunnel.exe, build\SabiTunnel.exe.config, setup\SabiTunnel-Setup.exe "$out\bin\"
          if ($bad -gt 0) { exit 1 }

      - name: Render UI previews (offline, every build)
        timeout-minutes: 3
        shell: pwsh
        run: |
          $d = "$env:GITHUB_WORKSPACE\shots\ui"
          $p = Start-Process "$env:GITHUB_WORKSPACE\build\SabiTunnel.exe" -ArgumentList "--shots=$d" -PassThru -Wait
          Write-Host "exit: $($p.ExitCode)"
          if (Test-Path "$env:GITHUB_WORKSPACE\build\trusttunnel_gui_error.log") { Get-Content "$env:GITHUB_WORKSPACE\build\trusttunnel_gui_error.log" }
          Get-ChildItem $d -ErrorAction SilentlyContinue | Format-Table Name, Length

      - name: Self-test (relay links, Telegram RTL marks, DNS-over-HTTPS fallback, wizard import)
        timeout-minutes: 4
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'tt-selftest'
          Copy-Item pkg\SabiTunnel $t -Recurse -Force
          $out = "$env:GITHUB_WORKSPACE\shots\selftest.txt"
          $p = Start-Process "$t\SabiTunnel.exe" -ArgumentList "--selftest=$out" -PassThru -Wait
          if (Test-Path $out) { Get-Content $out -Encoding utf8 } else { Write-Host 'no selftest output' }
          if (Test-Path "$t\trusttunnel_gui_error.log") { Get-Content "$t\trusttunnel_gui_error.log" }
          Write-Host "exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Files for the panel and the release (setup + portable zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist -Force | Out-Null
          Copy-Item setup/SabiTunnel-Setup.exe dist/
          # the zip holds the SabiTunnel folder; portable copies swap their files in from it when they update
          Compress-Archive -Path pkg/SabiTunnel -DestinationPath dist/SabiTunnel-Windows.zip -Force
          Set-Location dist
          $sums = foreach ($f in 'SabiTunnel-Setup.exe', 'SabiTunnel-Windows.zip') { '{0}  {1}' -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), $f }
          $sums | Set-Content -Encoding ascii SHA256SUMS.txt; $sums | Write-Host

      - name: Keep the files for the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: SabiTunnel-Windows-dist
          path: dist/
          retention-days: 7

      - name: Live UI test against the real server
        if: env.TT_TEST_LINK != ''
        timeout-minutes: 16
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          Add-Type @'
          using System; using System.Text; using System.Collections.Generic; using System.Runtime.InteropServices;
          public static class M {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x,int y);
            [DllImport("user32.dll")] public static extern void mouse_event(int f,int x,int y,int d,IntPtr e);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h,int m,IntPtr w,IntPtr l);
            public delegate bool EP(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(EP cb, IntPtr l);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            [DllImport("user32.dll")] static extern bool GetWindowRect(IntPtr h, out RECT r);
            public static string[] List(int pid) {
              var res = new List<string>();
              EnumWindows((h, l) => { uint p; GetWindowThreadProcessId(h, out p);
                if (p == pid && IsWindowVisible(h)) { var sb = new StringBuilder(256); GetWindowText(h, sb, 256); RECT r; GetWindowRect(h, out r);
                  res.Add(h.ToInt64() + "|" + sb + "|" + r.L + "|" + r.T + "|" + (r.R - r.L) + "|" + (r.B - r.T)); }
                return true; }, IntPtr.Zero);
              return res.ToArray();
            }
          }
          '@
          $shots = "$env:GITHUB_WORKSPACE\shots"
          New-Item -ItemType Directory $shots -Force | Out-Null
          $R = [ordered]@{}
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$shots\$name.png"); $g.Dispose(); $bmp.Dispose()
            Write-Host "shot: $name"
          }
          function Ip { $r = & curl.exe -s --max-time 12 -H 'Connection: close' https://api.ipify.org; if ($r) { $r.Trim() } else { 'error' } }
          function Gui { Get-Process SabiTunnel -ErrorAction SilentlyContinue | Select-Object -First 1 }
          function Client { [bool](Get-Process trusttunnel_client -ErrorAction SilentlyContinue) }
          function GuiCmd($c) { Start-Process .\SabiTunnel.exe -ArgumentList "--$c"; Start-Sleep -Milliseconds 2200 }
          function Wins {
            $p = Gui; if (-not $p) { return @() }
            @([M]::List($p.Id) | ForEach-Object { $a = $_.Split('|'); [pscustomobject]@{ H = [IntPtr][long]$a[0]; Name = $a[1]; X = [int]$a[2]; Y = [int]$a[3]; W = [int]$a[4]; Hh = [int]$a[5] } } | Where-Object { $_.Name -ne '' -and $_.W -gt 60 })
          }
          function MainWin { Wins | Where-Object { $_.Name -eq 'SABI TUNNEL' } | Select-Object -First 1 }
          function CloseDialogs {
            foreach ($w in Wins) { if ($w.Name -ne 'SABI TUNNEL') { Write-Host "closing window '$($w.Name)'"; [void][M]::PostMessage($w.H, 0x10, [IntPtr]::Zero, [IntPtr]::Zero) } }
            Start-Sleep 1
          }
          function ClickMain($lx, $ly, $label) {
            $w = MainWin
            if (-not $w) { Write-Host "main window not found for $label"; return $false }
            $s = $w.W / 380.0
            [void][M]::SetForegroundWindow($w.H); Start-Sleep -Milliseconds 300
            $x = [int]($w.X + $lx * $s); $y = [int]($w.Y + $ly * $s)
            [void][M]::SetCursorPos($x, $y); Start-Sleep -Milliseconds 250
            [M]::mouse_event(2,0,0,0,[IntPtr]::Zero); Start-Sleep -Milliseconds 60; [M]::mouse_event(4,0,0,0,[IntPtr]::Zero)
            Write-Host "clicked $label at $x,$y (window $($w.X),$($w.Y) $($w.W)x$($w.Hh), scale $s)"
            Start-Sleep -Milliseconds 200; [void][M]::SetCursorPos(1000, 700)
            return $true
          }
          function ClickDlg($w, $lx, $ly, $base, $label) {
            $s = $w.W / $base
            [void][M]::SetForegroundWindow($w.H); Start-Sleep -Milliseconds 300
            $x = [int]($w.X + $lx * $s); $y = [int]($w.Y + $ly * $s)
            [void][M]::SetCursorPos($x, $y); Start-Sleep -Milliseconds 250
            [M]::mouse_event(2,0,0,0,[IntPtr]::Zero); Start-Sleep -Milliseconds 60; [M]::mouse_event(4,0,0,0,[IntPtr]::Zero)
            Write-Host "clicked $label at $x,$y in '$($w.Name)'"
            Start-Sleep -Milliseconds 200; [void][M]::SetCursorPos(1000, 700)
          }
          function Dlg { Wins | Where-Object { $_.Name -ne 'SABI TUNNEL' } | Select-Object -First 1 }
          function Enter { $d = Dlg; if ($d) { [void][M]::SetForegroundWindow($d.H); Start-Sleep -Milliseconds 400; [System.Windows.Forms.SendKeys]::SendWait('{ENTER}'); Write-Host "ENTER on '$($d.Name)'" } }
          function TomlUser { $m = Select-String -Path trusttunnel_client.toml -Pattern '^username = "(.*)"' -ErrorAction SilentlyContinue; if ($m) { $m.Matches[0].Groups[1].Value } else { '' } }
          function Servers { @(Get-ChildItem servers -Filter *.toml -ErrorAction SilentlyContinue).Count }
          function Windows($label) { Write-Host "--- windows ($label) ---"; foreach ($w in Wins) { Write-Host ("  '{0}'  {1},{2} {3}x{4}" -f $w.Name, $w.X, $w.Y, $w.W, $w.Hh) } }

          # ---------- panel share page, rendered by Edge (phone-sized)
          if ($env:TT_TEST_SHARE) {
            $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
            & $edge --headless=new --disable-gpu --hide-scrollbars --window-size=420,1640 --force-device-scale-factor=2 "--screenshot=$shots\30-share-page.png" $env:TT_TEST_SHARE 2>$null
            Start-Sleep 6
            $R.share_page_shot = Test-Path "$shots\30-share-page.png"
          }
          # ---------- install with the real Setup.exe, then test from Program Files
          $p = Start-Process "$env:GITHUB_WORKSPACE\setup\SabiTunnel-Setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon',"/LOG=$shots\setup.log" -Wait -PassThru
          $app = "$env:ProgramFiles\SabiTunnel"
          $R.setup_exit = $p.ExitCode
          $R.installed = Test-Path "$app\SabiTunnel.exe"
          $R.start_menu = Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\SABI TUNNEL\SABI TUNNEL.lnk"
          $R.desktop_icon = Test-Path "$env:PUBLIC\Desktop\SABI TUNNEL.lnk"
          $R.proto_hklm = [string](Get-ItemProperty 'HKLM:\Software\Classes\tt\shell\open\command' -ErrorAction SilentlyContinue).'(default)'
          Set-Location $app
          $R.before = Ip; Write-Host "IP before: $($R.before)"

          # ---------- A: first run, no settings -> import dialog
          Start-Process .\SabiTunnel.exe; Start-Sleep 7
          Windows 'first run'; Shot '01-first-run-import'
          CloseDialogs; Start-Sleep 1; Shot '02-no-config'
          GuiCmd 'quit'; Start-Sleep 3
          $R.quit_first_run = -not (Gui)
          Get-Process SabiTunnel -ErrorAction SilentlyContinue | Stop-Process -Force

          # ---------- B: configured, idle
          .\setup_wizard.exe --mode non-interactive --deeplink $env:TT_TEST_LINK --settings trusttunnel_client.toml | Out-Null
          $t = [IO.File]::ReadAllText("$PWD\trusttunnel_client.toml") -replace '(?m)^killswitch_enabled = .*', 'killswitch_enabled = false'
          [IO.File]::WriteAllText("$PWD\trusttunnel_client.toml", $t)
          [IO.File]::WriteAllText("$PWD\gui.ini", "autoconnect=0`r`nname=Sabi VPN`r`n")
          Start-Process .\SabiTunnel.exe; Start-Sleep 6
          Windows 'idle'; Shot '03-off'
          GuiCmd 'settings'; Start-Sleep 1; Shot '04-settings'
          GuiCmd 'bypass'; Start-Sleep 1; Windows 'bypass'; Shot '05-bypass'; CloseDialogs
          GuiCmd 'home'; Start-Sleep 1

          # ---------- C: connect with a real mouse click on the big button
          $R.click_connect = ClickMain 190 417 'connect'
          Start-Sleep -Milliseconds 1500; Shot '06-connecting'
          Start-Sleep 22
          $R.connected_ip = Ip; Write-Host "IP while connected: $($R.connected_ip)"
          $R.client_running = Client
          Shot '07-on'
          $dl = Start-Job { & curl.exe -s -o NUL --limit-rate 3000k --max-time 25 'https://speed.cloudflare.com/__down?bytes=60000000' }
          Start-Sleep 9; Shot '08-on-traffic'
          Wait-Job $dl -Timeout 20 | Out-Null; Remove-Job $dl -Force
          GuiCmd 'settings'; Start-Sleep 1; Shot '09-settings-connected'
          # switch to HTTP/3 with a real click while connected -> the app must reconnect on its own
          $R.click_http3 = ClickMain 105 113 'HTTP/3 segment'
          Start-Sleep 24
          $R.http3_saved = [bool](Select-String -Path trusttunnel_client.toml -Pattern 'upstream_protocol = "http3"' -Quiet)
          $R.http3_ip = Ip; $R.http3_client = Client
          GuiCmd 'home'; Start-Sleep 1; Shot '09b-http3'
          GuiCmd 'settings'; Start-Sleep 1
          [void](ClickMain 275 113 'HTTP/2 segment'); Start-Sleep 20
          $R.http2_saved = [bool](Select-String -Path trusttunnel_client.toml -Pattern 'upstream_protocol = "http2"' -Quiet)
          $R.http2_back_ip = Ip
          GuiCmd 'log'; Start-Sleep 1; Windows 'log'; Shot '10-log'; CloseDialogs
          GuiCmd 'home'; Start-Sleep 1

          # ---------- D: disconnect with a real click
          $R.click_disconnect = ClickMain 190 417 'disconnect'
          Start-Sleep -Milliseconds 700; Shot '11-stopping'
          Start-Sleep 9; Shot '12-off-again'
          $R.client_after_disconnect = Client
          $R.ip_after_disconnect = Ip

          # ---------- E: click the orb to connect, CLI toggle off, CLI connect, then --quit while connected
          $R.click_orb = ClickMain 190 234 'orb'
          Start-Sleep 20
          $R.orb_ip = Ip; $R.orb_client = Client
          $dl = Start-Job { & curl.exe -s -o NUL --limit-rate 1500k --max-time 20 'https://speed.cloudflare.com/__down?bytes=40000000' }
          Start-Sleep 7; Shot '13-orb-on-traffic'
          Wait-Job $dl -Timeout 15 | Out-Null; Remove-Job $dl -Force
          GuiCmd 'toggle'; Start-Sleep 9
          $R.toggle_off_client = Client
          GuiCmd 'connect'; Start-Sleep 18
          $R.cli_connect_ip = Ip; $R.cli_connect_client = Client
          GuiCmd 'log'; Start-Sleep 1; Shot '14-log-connected'; CloseDialogs
          GuiCmd 'quit'; Start-Sleep 12
          $R.gui_after_quit = [bool](Gui); $R.client_after_quit = Client
          $R.ip_after_quit = Ip
          Shot '15-after-quit'

          # ---------- F: add a 2nd server by opening a tt:// link (protocol handler -> running app), switch, delete
          Start-Process .\SabiTunnel.exe; Start-Sleep 6
          $R.migrated_servers = Servers
          $R.proto_hkcu = [string](Get-ItemProperty 'HKCU:\Software\Classes\tt\shell\open\command' -ErrorAction SilentlyContinue).'(default)'
          if ($env:TT_TEST_LINK2) {
            Start-Process $env:TT_TEST_LINK2; Start-Sleep 6
            Windows 'tt:// opened'; Shot '16-link-opened'
            $R.link_dialog = [bool](Dlg)
            Enter; Start-Sleep 9
            Windows 'after save'; Shot '17-added'; CloseDialogs
            $R.servers_after_add = Servers; $R.active_after_add = TomlUser
            GuiCmd 'connect'; Start-Sleep 18
            $R.p2_client = Client; $R.p2_ip = Ip
            Shot '18-second-server-on'
            GuiCmd 'servers'; Start-Sleep 1
            Windows 'servers'; Shot '19-servers'
            $d = Dlg
            if ($d) { ClickDlg $d 260 100 440 'first server row' }
            Start-Sleep -Milliseconds 1500; Shot '20-switching'
            Start-Sleep 24
            $R.switched_user = TomlUser; $R.switch_client = Client; $R.switch_ip = Ip
            Shot '21-switched'
            GuiCmd 'servers'; Start-Sleep 1
            $d = Dlg
            if ($d) { ClickDlg $d 50 160 440 'trash on second row' }
            Start-Sleep 1; Windows 'delete?'; Shot '22-delete-ask'
            Enter; Start-Sleep 2
            Windows 'after delete'; Shot '23-after-delete'; CloseDialogs
            $R.servers_after_delete = Servers; $R.client_after_delete = Client
            GuiCmd 'settings'; Start-Sleep 1; Shot '24-settings'; GuiCmd 'home'
            # first-instance path: quit, then open the link with the app closed
            GuiCmd 'quit'; Start-Sleep 12
            Start-Process $env:TT_TEST_LINK2; Start-Sleep 8
            $R.cold_link_dialog = [bool](Dlg)
            Windows 'cold link'; Shot '25-cold-link'; CloseDialogs
            # leave it running + connected so the uninstaller has to stop it
            GuiCmd 'connect'; Start-Sleep 18
            $R.before_uninstall_client = Client
          }

          # ---------- report
          Copy-Item trusttunnel_last.log $shots -ErrorAction SilentlyContinue
          if (Test-Path trusttunnel_gui_error.log) { $R.crash_log = $true; Copy-Item trusttunnel_gui_error.log $shots; Write-Host '--- CRASH LOG ---'; Get-Content trusttunnel_gui_error.log | Write-Host } else { $R.crash_log = $false }
          Write-Host '--- GUI log (tail) ---'; Get-Content trusttunnel_last.log -ErrorAction SilentlyContinue | Select-Object -Last 60 | Out-String | Write-Host

          # ---------- G: silent uninstall while connected
          Set-Location $env:GITHUB_WORKSPACE
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          for ($i = 0; $i -lt 40 -and (Test-Path $app); $i++) { Start-Sleep 1 }
          Start-Sleep 3
          $R.uninst_gui = [bool](Gui); $R.uninst_client = Client
          $R.uninst_dir_left = Test-Path $app
          $R.uninst_proto_left = Test-Path 'HKLM:\Software\Classes\tt'
          $R.uninst_task_left = [bool](schtasks /Query /TN SabiTunnel 2>$null)
          $R.ip_after_uninstall = Ip
          Write-Host '--- routes ---'; route print -4 | Select-Object -First 30 | Out-String | Write-Host
          ($R.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join "`n" | Set-Content "$shots\result.txt"
          Get-Content "$shots\result.txt" | Write-Host
          Get-Process SabiTunnel, trusttunnel_client -ErrorAction SilentlyContinue | Stop-Process -Force
          New-Item -ItemType Directory "$shots\bin" -Force | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\build\SabiTunnel.exe", "$env:GITHUB_WORKSPACE\build\SabiTunnel.exe.config", "$env:GITHUB_WORKSPACE\setup\SabiTunnel-Setup.exe" "$shots\bin\"

      - name: Publish GitHub release (created automatically when the version is new)
        if: github.ref == 'refs/heads/main' && (inputs.release || github.event_name == 'push')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.release }}
        run: |
          $v = $env:APP_VERSION; $tag = "v$v"
          Set-Location dist
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "SABI TUNNEL for Windows $v" --notes-file ../windows-gui/RELEASE_NOTES.md --target $env:GITHUB_SHA --latest
          } elseif ($env:FORCE -eq 'true') {
            gh release edit $tag --title "SABI TUNNEL for Windows $v" --notes-file ../windows-gui/RELEASE_NOTES.md
          } else {
            Write-Host "release $tag already exists (run the workflow with 'release' to refresh its files); the apps update from the panel"
            exit 0
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          gh release upload $tag SabiTunnel-Setup.exe SabiTunnel-Windows.zip SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          gh release view $tag --json url,assets --jq '.url, (.assets[] | "\(.name) \(.size)")'

      - name: Publish test results to ci-results branch
        if: always()
        shell: pwsh
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-results
          git rm -rf --cached . | Out-Null
          git add -f shots
          git commit -m "results $env:GITHUB_RUN_ID"
          git push -f origin ci-results

      - name: Upload package
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SabiTunnel-Windows
          path: |
            pkg/
            setup/

  deploy:
    name: Publish to the panel (installed apps update themselves)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: sabi-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SabiTunnel-Windows-dist
          path: dist

      - name: Send the build to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          BUILD: ${{ github.run_number }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::warning::DEPLOY_SSH_KEY / DEPLOY_HOST / DEPLOY_KNOWN_HOSTS are not set: the build was not published"; exit 0
          fi
          mkdir -p bundle/apps
          cp dist/SabiTunnel-Setup.exe dist/SabiTunnel-Windows.zip bundle/apps/
          python3 - <<'PY'
          import hashlib, json, os
          d = "bundle/apps"
          def f(name):
              p = os.path.join(d, name)
              h = hashlib.sha256()
              with open(p, "rb") as fh:
                  for b in iter(lambda: fh.read(1 << 20), b""):
                      h.update(b)
              return {"name": name, "sha256": h.hexdigest(), "size": os.path.getsize(p)}
          notes = [l.strip() for l in (os.environ.get("NOTES") or "").splitlines() if l.strip()]
          part = {"windows": {"version": os.environ["APP_VERSION"], "build": int(os.environ["BUILD"]),
                              "notes": notes[0][:300] if notes else "", "commit": os.environ["GITHUB_SHA"][:12],
                              "files": {"setup": f("SabiTunnel-Setup.exe"), "zip": f("SabiTunnel-Windows.zip")}}}
          with open(os.path.join(d, "manifest-part.json"), "w", encoding="utf-8") as fh:
              json.dump(part, fh, ensure_ascii=False, indent=1)
          print(json.dumps(part, ensure_ascii=False, indent=1))
          PY
          tar -C bundle -czf bundle.tgz apps
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/sabi_deploy && chmod 600 ~/.ssh/sabi_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/sabi_known_hosts
          for i in 1 2 3; do
            if ssh -i ~/.ssh/sabi_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
                 -o UserKnownHostsFile="$HOME/.ssh/sabi_known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=15 \
                 "sabi-ci@$DEPLOY_HOST" < bundle.tgz; then exit 0; fi
            echo "attempt $i failed"; sleep $((i * 15))
          done
          exit 1
