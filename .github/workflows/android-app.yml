name: Android app

# Builds SABI TUNNEL for Android (TrustTunnel Flutter client, upstream v1.2.0). On main the APKs go to the panel,
# where installed apps pick them up and update themselves, and a GitHub Release is created for a new version.

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-app.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release with the APKs'
        type: boolean
        default: false

permissions:
  contents: write
  packages: read
  actions: write

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: '1.3.0'
  RELEASE_TAG: 'android-v1.3.0'
  FLUTTER_VERSION: '3.38.3'
  TT_LIB: 'com/adguard/trusttunnel/trusttunnel-client-android/1.1.5-rc.3/trusttunnel-client-android-1.1.5-rc.3.pom'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
        working-directory: android-app
    env:
      # The TrustTunnel native library is published on GitHub Packages (Maven),
      # which always needs a token. A GPR_KEY secret (classic PAT, read:packages)
      # wins; otherwise the workflow token is tried.
      GPR_KEY: ${{ secrets.GPR_KEY || github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Check access to the TrustTunnel Android library
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -u "token:${GPR_KEY}" \
            "https://maven.pkg.github.com/TrustTunnel/TrustTunnelClient/${TT_LIB}")
          echo "GitHub Packages answered HTTP ${code}"
          # 200, or a 302 redirect to the package storage, both mean access is granted.
          if [ "$code" != "200" ] && [ "$code" != "302" ]; then
            echo "::error::Cannot read the TrustTunnel library from GitHub Packages (HTTP ${code}). Add a repository secret GPR_KEY holding a classic personal access token with the read:packages scope."
            exit 1
          fi

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_B64 secret; the APK will be signed with a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          {
            echo "ORG_GRADLE_PROJECT_signingConfigKeyStorePath=$RUNNER_TEMP/release.p12"
            echo "ORG_GRADLE_PROJECT_signingConfigKeyStorePassword=$KEYSTORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_signingConfigKeyPassword=$KEYSTORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_signingConfigKeyAlias=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Dependencies and code generation
        run: make init

      - name: Analyze (fails only on errors)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APKs
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((120000 + GITHUB_RUN_NUMBER))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          mkdir -p ../dist
          # SABI_BUILD: the number the app compares with the panel feed to update itself (split APKs get their
          # own version codes, so the app does not use its version code for that)
          flutter build apk --release --split-per-abi \
            --build-name="$APP_VERSION" --build-number="$BUILD_NUMBER" --dart-define=SABI_BUILD="$BUILD_NUMBER" --no-pub
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "../dist/SabiTunnel-${APP_VERSION}-${abi}.apk"
          done
          flutter build apk --release \
            --build-name="$APP_VERSION" --build-number="$BUILD_NUMBER" --dart-define=SABI_BUILD="$BUILD_NUMBER" --no-pub
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/SabiTunnel-${APP_VERSION}-universal.apk"
          cd ../dist
          sha256sum *.apk > SHA256SUMS.txt
          ls -la
          cat SHA256SUMS.txt

      - name: Verify signature
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "../dist/SabiTunnel-${APP_VERSION}-universal.apk" | grep -E 'DN|SHA-256' || true
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "../dist/SabiTunnel-${APP_VERSION}-arm64-v8a.apk" | head -3 || true

      - name: Publish to the panel (installed apps update themselves)
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::warning::DEPLOY_SSH_KEY / DEPLOY_HOST / DEPLOY_KNOWN_HOSTS are not set: the build was not published"; exit 0
          fi
          mkdir -p bundle/apps
          for abi in arm64-v8a armeabi-v7a; do
            cp "dist/SabiTunnel-${APP_VERSION}-${abi}.apk" "bundle/apps/SabiTunnel-${abi}.apk"
          done
          python3 - <<'PY'
          import hashlib, json, os
          d = "bundle/apps"
          def f(name):
              p = os.path.join(d, name)
              h = hashlib.sha256()
              with open(p, "rb") as fh:
                  for b in iter(lambda: fh.read(1 << 20), b""):
                      h.update(b)
              return {"name": name, "sha256": h.hexdigest(), "size": os.path.getsize(p)}
          notes = [l.strip() for l in (os.environ.get("NOTES") or "").splitlines() if l.strip()]
          part = {"android": {"version": os.environ["APP_VERSION"], "code": int(os.environ["BUILD_NUMBER"]),
                              "notes": notes[0][:300] if notes else "", "commit": os.environ["GITHUB_SHA"][:12],
                              "files": {abi: f(f"SabiTunnel-{abi}.apk") for abi in ("arm64-v8a", "armeabi-v7a")}}}
          with open(os.path.join(d, "manifest-part.json"), "w", encoding="utf-8") as fh:
              json.dump(part, fh, ensure_ascii=False, indent=1)
          print(json.dumps(part, ensure_ascii=False, indent=1))
          PY
          tar -C bundle -czf bundle.tgz apps
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/sabi_deploy && chmod 600 ~/.ssh/sabi_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/sabi_known_hosts
          for i in 1 2 3; do
            if ssh -i ~/.ssh/sabi_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
                 -o UserKnownHostsFile="$HOME/.ssh/sabi_known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=15 \
                 "sabi-ci@$DEPLOY_HOST" < bundle.tgz; then exit 0; fi
            echo "attempt $i failed"; sleep $((i * 15))
          done
          exit 1

      - name: Publish release (created automatically when the version is new)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.release)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$FORCE" != "true" ]; then
              echo "release $RELEASE_TAG already exists (run the workflow with 'release' to refresh its files)"; exit 0
            fi
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --title "SABI TUNNEL Android ${APP_VERSION}" --notes-file android-app/RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "SABI TUNNEL Android ${APP_VERSION}" \
              --notes-file android-app/RELEASE_NOTES.md
          fi

      - name: Emulator screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-screens.yml -R "$GITHUB_REPOSITORY" -f tag="$RELEASE_TAG" || true
