name: UI screenshots

on:
  workflow_dispatch:
  push:
    branches: [ui-v3]
    paths: ['panel/**', 'docs/**', '.github/ui/**', '.github/workflows/ui-shots.yml']

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Render panel, share page and docs art with headless Chromium
        run: |
          pip install -q playwright qrcode
          python -m playwright install --with-deps chromium >/dev/null
          sudo apt-get install -y -q fonts-noto-color-emoji >/dev/null || true
          mkdir -p shots
          python .github/ui/shoot.py 2>&1 | tee shots/log.txt
      - name: Publish to ui-shots branch
        if: always()
        run: |
          mkdir -p shots && cd shots
          git init -q && git checkout -q -b ui-shots
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "ui shots ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ui-shots:ui-shots
